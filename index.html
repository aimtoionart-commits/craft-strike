<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>Craft Strike — арена 3 на 3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --blue: #29B6F6;
            --red: #EF5350;
            --gold: #FFD54F;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%; overflow: hidden; background: #0d1117;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

        /* ---------- HUD сверху ---------- */
        #hud { position: fixed; top: calc(8px + var(--safe-top)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 15; }
        #topbar {
            display: flex; align-items: center; gap: 12px; padding: 6px 16px;
            background: rgba(10, 16, 24, 0.66); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px; color: #fff; font-weight: 700; font-size: 14px;
            letter-spacing: 0.5px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
        }
        .team { display: flex; align-items: center; gap: 6px; }
        .team.blue { color: var(--blue); }
        .team.red { color: var(--red); }
        .team .score { color: #fff; font-size: 18px; }
        #timer { color: #cfe3ff; min-width: 46px; text-align: center; font-size: 14px; }

        /* ---------- Подсказка ---------- */
        #hint {
            position: fixed; left: 50%; top: calc(58px + var(--safe-top)); transform: translateX(-50%);
            max-width: 320px; padding: 7px 14px; border-radius: 12px; text-align: center;
            background: rgba(10, 16, 24, 0.7); color: #cfe3ff; font-size: 12px; line-height: 1.35;
            opacity: 0; pointer-events: none; z-index: 16;
        }
        #hint.show { animation: hintFade 6s ease forwards; }
        @keyframes hintFade {
            0% { opacity: 0; } 8% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; }
        }

        /* ---------- Джойстики ---------- */
        .joy {
            position: fixed; width: 124px; height: 124px; border-radius: 50%; z-index: 20;
            background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03) 62%, transparent 74%);
            border: 2px solid rgba(255, 255, 255, 0.28);
        }
        .joy .knob {
            position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
            border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.20));
            border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .joy .joy-label {
            position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
            font-size: 10px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.45); pointer-events: none;
        }
        .joy.active { border-color: rgba(255, 255, 255, 0.6); }
        #joyMove { left: 16px; bottom: calc(16px + var(--safe-bottom)); }
        #joyFire { right: 16px; bottom: calc(16px + var(--safe-bottom)); }
        #joyFire .knob {
            background: radial-gradient(circle at 40% 35%, rgba(255, 213, 79, 0.8), rgba(255, 152, 0, 0.35));
            border-color: rgba(255, 213, 79, 0.8);
        }

        /* ---------- Кнопка СУПЕР ---------- */
        #superBtn {
            position: fixed; right: 24px; bottom: calc(152px + var(--safe-bottom));
            width: 68px; height: 68px; border-radius: 50%; z-index: 21; overflow: hidden;
            display: grid; place-items: center; cursor: pointer;
            background: rgba(12, 18, 28, 0.72); border: 2px solid rgba(255, 255, 255, 0.22);
            color: #8fa3b6; font: 800 12px/1 "Trebuchet MS", sans-serif; letter-spacing: 0.5px;
            touch-action: manipulation; -webkit-appearance: none;
        }
        #superBtn .charge { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
        #superBtn .charge::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: 0;
            height: calc(var(--p, 0) * 1%); background: rgba(255, 213, 79, 0.42);
        }
        #superBtn .super-text { position: relative; z-index: 1; }
        #superBtn.ready {
            color: #3b2b00; border-color: #FFF3C4;
            background: linear-gradient(180deg, #FFE082, #FFB300);
            animation: superPulse 1.4s infinite;
        }
        #superBtn.ready .charge { display: none; }
        @keyframes superPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 213, 79, 0.55); }
            70% { box-shadow: 0 0 0 14px rgba(255, 213, 79, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 213, 79, 0); }
        }

        /* ---------- Оверлеи меню и результата ---------- */
        .overlay {
            position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px; overflow-y: auto;
            padding: calc(18px + var(--safe-top)) 16px calc(18px + var(--safe-bottom));
            background: radial-gradient(circle at 50% 22%, rgba(41, 182, 246, 0.22), rgba(8, 12, 20, 0.95) 58%), rgba(8, 12, 20, 0.92);
        }
        .overlay.hidden { display: none; }
        body.in-menu #hud, body.in-menu .joy, body.in-menu #superBtn, body.in-menu #hint { display: none; }

        .logo { font-size: 38px; line-height: 1; font-weight: 900; letter-spacing: 2px; color: #fff; text-align: center; text-shadow: 0 4px 0 #1565C0, 0 10px 26px rgba(0, 0, 0, 0.6); }
        .logo span { color: var(--gold); }
        .subtitle { max-width: 340px; color: #9fb0c4; font-size: 13px; line-height: 1.45; text-align: center; }

        #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: 440px; }
        .card {
            flex: 1 1 118px; max-width: 140px; padding: 12px 10px; border-radius: 16px; cursor: pointer;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
            border: 2px solid rgba(255, 255, 255, 0.14); color: #fff; text-align: center;
            font-family: inherit; transition: transform 0.15s, border-color 0.15s, background 0.15s;
        }
        .card.selected { border-color: var(--gold); background: linear-gradient(180deg, rgba(255, 213, 79, 0.22), rgba(255, 213, 79, 0.05)); transform: translateY(-3px); }
        .card .avatar { font-size: 28px; line-height: 1.2; }
        .card .name { margin: 2px 0 8px; font-size: 14px; font-weight: 800; }
        .stat { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 9px; color: #a9bdcc; letter-spacing: 0.4px; }
        .stat > span:first-child { width: 32px; text-align: left; }
        .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
        .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4FC3F7, #FFD54F); }

        .btn {
            padding: 14px 44px; border: none; border-radius: 999px; cursor: pointer;
            font-family: inherit; font-size: 18px; font-weight: 900; letter-spacing: 1px; color: #08202e;
            background: linear-gradient(180deg, #FFE082, #FFB300);
            box-shadow: 0 6px 0 #B26A00, 0 10px 28px rgba(0, 0, 0, 0.4);
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #B26A00; }
        .btn.ghost {
            padding: 12px 32px; font-size: 15px; color: #cfe3ff;
            background: transparent; border: 2px solid rgba(255, 255, 255, 0.25); box-shadow: none;
        }
        .wins { color: #8fa3b6; font-size: 12px; }

        .result-title { font-size: 40px; font-weight: 900; letter-spacing: 2px; text-align: center; }
        .result-title.win { color: var(--gold); text-shadow: 0 4px 0 #C68600, 0 10px 26px rgba(0, 0, 0, 0.6); }
        .result-title.lose { color: #EF9A9A; text-shadow: 0 4px 0 #7f1d1d; }
        .result-title.draw { color: #B0BEC5; }
        .result-score { font-size: 34px; font-weight: 900; color: #fff; letter-spacing: 3px; }

        @media (max-height: 620px) {
            .logo { font-size: 30px; }
            .card { flex-basis: 100px; padding: 8px; }
            .card .avatar { font-size: 22px; }
            .btn { padding: 11px 34px; font-size: 16px; }
        }
    </style>
</head>
<body class="in-menu">
    <canvas id="game"></canvas>

    <div id="hud">
        <div id="topbar">
            <div class="team blue">СИНИЕ <span class="score" id="scoreBlue">0</span></div>
            <div id="timer">1:30</div>
            <div class="team red"><span class="score" id="scoreRed">0</span> КРАСНЫЕ</div>
        </div>
    </div>

    <div id="hint">Двигайся левым джойстиком · стреляй правым · СУПЕР копится от урона</div>

    <div id="joyMove" class="joy"><span class="joy-label">ХОД</span><div class="knob"></div></div>
    <div id="joyFire" class="joy"><span class="joy-label">ОГОНЬ</span><div class="knob"></div></div>
    <button id="superBtn" type="button"><span class="charge"></span><span class="super-text">СУПЕР</span></button>

    <div id="menu" class="overlay">
        <div class="logo">CRAFT<span>STRIKE</span></div>
        <div class="subtitle">Арена 3 на 3. Выбери бойца, помоги синей команде и набери 8 фрагов раньше красных.</div>
        <div id="cards"></div>
        <button class="btn" id="playBtn" type="button">ИГРАТЬ</button>
        <div class="wins" id="winsLabel">Побед: 0</div>
    </div>

    <div id="result" class="overlay hidden">
        <div class="result-title" id="resultTitle">ПОБЕДА</div>
        <div class="result-score" id="resultScore">0 : 0</div>
        <div class="subtitle" id="resultSub"></div>
        <button class="btn" id="againBtn" type="button">ЕЩЁ РАЗ</button>
        <button class="btn ghost" id="menuBtn" type="button">В МЕНЮ</button>
    </div>

    <script>
    (() => {
        'use strict';

        /* ==============================================================
           1. TELEGRAM MINI APP
           ============================================================== */
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#0d1117');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#0d1117');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        }

        function haptic(kind) {
            if (!tg || !tg.HapticFeedback) return;
            try {
                if (kind === 'light') tg.HapticFeedback.impactOccurred('light');
                else if (kind === 'medium') tg.HapticFeedback.impactOccurred('medium');
                else if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
                else if (kind === 'error') tg.HapticFeedback.notificationOccurred('error');
            } catch (e) { /* старые версии Telegram */ }
        }

        /* ==============================================================
           2. КАНВАС И РАЗМЕРЫ ЭКРАНА
           ============================================================== */
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W = 0;
        let H = 0;
        let DPR = 1;
        let groundPattern = null;
        let vignette = null;

        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

        /* ==============================================================
           3. НАСТРОЙКИ ИГРЫ И БОЙЦЫ
           ============================================================== */
        const KILLS_TO_WIN = 8;      // сколько фрагов нужно команде
        const MATCH_LENGTH = 90;     // длина матча в секундах
        const RESPAWN_TIME = 3000;   // возрождение в миллисекундах
        const REGEN_DELAY = 3500;    // через сколько мс без урона начинается реген
        const REGEN_RATE = 0.08;     // доля максимального HP в секунду

        const BRAWLERS = [
            {
                id: 'scout', name: 'Скаут', icon: '🔫', color: '#4FC3F7', colorDark: '#0277BD',
                hp: 3600, speed: 200,
                weapon: { damage: 430, pellets: 1, spread: 0.05, bulletSpeed: 760, cooldown: 380, reload: 1.5, ammo: 3, range: 560 }
            },
            {
                id: 'tank', name: 'Танк', icon: '💥', color: '#FFB74D', colorDark: '#E65100',
                hp: 5200, speed: 180,
                weapon: { damage: 230, pellets: 5, spread: 0.34, bulletSpeed: 660, cooldown: 620, reload: 1.9, ammo: 3, range: 380 }
            },
            {
                id: 'sniper', name: 'Снайпер', icon: '⚡', color: '#81C784', colorDark: '#2E7D32',
                hp: 3000, speed: 205,
                weapon: { damage: 900, pellets: 1, spread: 0.015, bulletSpeed: 1050, cooldown: 750, reload: 1.8, ammo: 3, range: 780 }
            }
        ];

        let selectedBrawlerId = 'scout';

        // Препятствия заданы в долях экрана — работают и на телефоне, и на ПК
        const WALL_LAYOUT = [
            { x: 0.05, y: 0.16, w: 0.13, h: 0.05 },
            { x: 0.82, y: 0.16, w: 0.13, h: 0.05 },
            { x: 0.40, y: 0.11, w: 0.20, h: 0.04 },
            { x: 0.05, y: 0.41, w: 0.07, h: 0.08 },
            { x: 0.88, y: 0.41, w: 0.07, h: 0.08 },
            { x: 0.40, y: 0.44, w: 0.20, h: 0.08 },
            { x: 0.19, y: 0.56, w: 0.12, h: 0.05 },
            { x: 0.69, y: 0.56, w: 0.12, h: 0.05 },
            { x: 0.05, y: 0.78, w: 0.13, h: 0.05 },
            { x: 0.82, y: 0.78, w: 0.13, h: 0.05 }
        ];
        let walls = [];

        /* ==============================================================
           4. СОСТОЯНИЕ МАТЧА
           ============================================================== */
        const game = {
            mode: 'menu',        // menu | playing | over
            now: 0,
            timeLeft: MATCH_LENGTH,
            scoreBlue: 0,
            scoreRed: 0,
            fighters: [],
            bullets: [],
            particles: [],
            floaters: [],
            player: null
        };

        const input = {
            keys: new Set(),
            moveX: 0,
            moveY: 0,
            fireHeld: false,
            mouseX: 0,
            mouseY: 0,
            mouseDown: false,
            mouseActive: false
        };

        /* ==============================================================
           5. СОХРАНЕНИЕ ПРОГРЕССА (побед)
           ============================================================== */
        const STORAGE_KEY = 'craftstrike_stats_v1';

        function loadStats() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const s = raw ? JSON.parse(raw) : null;
                return { wins: (s && s.wins) | 0, matches: (s && s.matches) | 0, bestKills: (s && s.bestKills) | 0 };
            } catch (e) {
                return { wins: 0, matches: 0, bestKills: 0 };
            }
        }

        function saveStats(s) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) { /* режим инкогнито */ }
        }

        let stats = loadStats();

        /* ==============================================================
           6. ГЕОМЕТРИЯ АРЕНЫ
           ============================================================== */
        function pointInWall(x, y) {
            for (const w of walls) {
                if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return true;
            }
            return false;
        }

        // Видит ли боец цель (не мешает ли стена)
        function hasLineOfSight(x1, y1, x2, y2) {
            const dist = Math.hypot(x2 - x1, y2 - y1);
            const steps = Math.ceil(dist / 14);
            for (let i = 1; i < steps; i++) {
                const t = i / steps;
                if (pointInWall(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false;
            }
            return true;
        }

        // Круг против прямоугольника: выталкиваем бойца из препятствия
        function resolveWalls(f) {
            for (const w of walls) {
                const nx = clamp(f.x, w.x, w.x + w.w);
                const ny = clamp(f.y, w.y, w.y + w.h);
                const dx = f.x - nx;
                const dy = f.y - ny;
                const d2 = dx * dx + dy * dy;
                if (d2 >= f.r * f.r) continue;

                if (d2 > 0.0001) {
                    const d = Math.sqrt(d2);
                    const push = f.r - d;
                    f.x += (dx / d) * push;
                    f.y += (dy / d) * push;
                } else {
                    // Центр оказался внутри блока — выталкиваем по ближайшей стороне
                    const left = f.x - w.x;
                    const right = w.x + w.w - f.x;
                    const top = f.y - w.y;
                    const bottom = w.y + w.h - f.y;
                    const min = Math.min(left, right, top, bottom);
                    if (min === left) f.x = w.x - f.r;
                    else if (min === right) f.x = w.x + w.w + f.r;
                    else if (min === top) f.y = w.y - f.r;
                    else f.y = w.y + w.h + f.r;
                }
            }
        }

        function buildWalls() {
            walls = WALL_LAYOUT.map(l => {
                const w = { x: l.x * W, y: l.y * H, w: Math.max(l.w * W, 42), h: Math.max(l.h * H, 24) };
                w.x = Math.min(w.x, W - w.w - 6);
                w.y = Math.min(w.y, H - w.h - 6);
                return w;
            });
        }

        function buildGround() {
            const tile = document.createElement('canvas');
            tile.width = 96;
            tile.height = 96;
            const g = tile.getContext('2d');
            g.fillStyle = '#2E6B3E';
            g.fillRect(0, 0, 96, 96);
            g.fillStyle = 'rgba(0, 0, 0, 0.055)';
            g.fillRect(0, 0, 48, 48);
            g.fillRect(48, 48, 48, 48);
            g.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let y = 12; y < 96; y += 24) {
                for (let x = 12; x < 96; x += 24) g.fillRect(x, y, 3, 3);
            }
            groundPattern = ctx.createPattern(tile, 'repeat');
        }

        function buildVignette() {
            vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.38)');
        }

        function resize() {
            const oldW = W;
            const oldH = H;
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            buildGround();
            buildWalls();
            buildVignette();

            // При повороте экрана пропорционально переносим всё, что уже на арене
            if (oldW > 0 && oldH > 0 && (oldW !== W || oldH !== H)) {
                const sx = W / oldW;
                const sy = H / oldH;
                game.fighters.forEach(f => {
                    f.x *= sx; f.y *= sy; f.spawnX *= sx; f.spawnY *= sy;
                    resolveWalls(f);
                });
                game.bullets.forEach(b => { b.x *= sx; b.y *= sy; });
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 120));

        /* ==============================================================
           7. ВИРТУАЛЬНЫЕ ДЖОЙСТИКИ
           ============================================================== */
        function bindStick(el) {
            const knob = el.querySelector('.knob');
            const st = { x: 0, y: 0, active: false };

            function maxDist() {
                return Math.max(12, el.clientWidth / 2 - knob.offsetWidth / 2);
            }

            function apply(clientX, clientY) {
                const rect = el.getBoundingClientRect();
                let dx = clientX - (rect.left + rect.width / 2);
                let dy = clientY - (rect.top + rect.height / 2);
                const max = maxDist();
                const dist = Math.hypot(dx, dy);
                if (dist > max) {
                    dx = (dx / dist) * max;
                    dy = (dy / dist) * max;
                }
                knob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
                st.x = dx / max;
                st.y = dy / max;
            }

            st.reset = function () {
                st.active = false;
                st.x = 0;
                st.y = 0;
                el.classList.remove('active');
                knob.style.transform = 'translate(0px, 0px)';
            };

            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                st.active = true;
                el.classList.add('active');
                if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
                apply(e.clientX, e.clientY);
            });

            el.addEventListener('pointermove', (e) => {
                if (!st.active) return;
                e.preventDefault();
                apply(e.clientX, e.clientY);
            });

            el.addEventListener('pointerup', st.reset);
            el.addEventListener('pointercancel', st.reset);
            el.addEventListener('lostpointercapture', st.reset);
            return st;
        }

        const moveStick = bindStick(document.getElementById('joyMove'));
        const fireStick = bindStick(document.getElementById('joyFire'));

        // Вектор стика с мёртвой зоной — так палец в центре не двигает бойца
        function stickVector(st) {
            const m = Math.hypot(st.x, st.y);
            if (!st.active || m < 0.16) return { x: 0, y: 0 };
            const scale = (m - 0.16) / 0.84;
            return { x: (st.x / m) * scale, y: (st.y / m) * scale };
        }

        /* ==============================================================
           8. КЛАВИАТУРА И МЫШЬ (для ПК)
           ============================================================== */
        const MOVE_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowLeft', 'ArrowDown', 'ArrowRight']);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || MOVE_KEYS.has(e.code)) {
                e.preventDefault();
                input.keys.add(e.code);
            }
            if ((e.code === 'KeyQ' || e.code === 'KeyE') && game.mode === 'playing' && game.player) {
                useSuper(game.player);
            }
        });

        window.addEventListener('keyup', (e) => input.keys.delete(e.code));
        window.addEventListener('blur', () => {
            input.keys.clear();
            input.mouseDown = false;
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'mouse') return;
            input.mouseDown = true;
            input.mouseActive = true;
            input.mouseX = e.clientX;
            input.mouseY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (e.pointerType === 'mouse') input.mouseDown = false;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'mouse') return;
            input.mouseActive = true;
            input.mouseX = e.clientX;
            input.mouseY = e.clientY;
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        function playerMoveX() {
            let x = stickVector(moveStick).x;
            if (input.keys.has('KeyA') || input.keys.has('ArrowLeft')) x -= 1;
            if (input.keys.has('KeyD') || input.keys.has('ArrowRight')) x += 1;
            return x;
        }

        function playerMoveY() {
            let y = stickVector(moveStick).y;
            if (input.keys.has('KeyW') || input.keys.has('ArrowUp')) y -= 1;
            if (input.keys.has('KeyS') || input.keys.has('ArrowDown')) y += 1;
            return y;
        }

        function isFiring() {
            return fireStick.active || input.mouseDown || input.keys.has('Space');
        }

        function resetInputs() {
            moveStick.reset();
            fireStick.reset();
            input.keys.clear();
            input.mouseDown = false;
            input.mouseActive = false;
        }

        /* ==============================================================
           9. БОЙЦЫ
           ============================================================== */
        let nextFighterId = 1;

        function makeFighter(team, brawler, x, y, isPlayer) {
            const f = {
                id: nextFighterId++,
                team: team,
                brawler: brawler,
                isPlayer: !!isPlayer,
                x: x,
                y: y,
                spawnX: x,
                spawnY: y,
                r: 17,
                speed: brawler.speed,
                hp: brawler.hp,
                maxHp: brawler.hp,
                color: brawler.color,
                colorDark: brawler.colorDark,
                weapon: brawler.weapon,
                aim: team === 'blue' ? -Math.PI / 2 : Math.PI / 2,
                ammo: brawler.weapon.ammo,
                reloadTimer: brawler.weapon.reload,
                nextShotAt: 0,
                alive: true,
                respawnAt: 0,
                flash: 0,
                lastDamageAt: -99999,
                superCharge: 0,
                superReady: false,
                kills: 0,
                deaths: 0,
                damageDealt: 0,
                ai: {
                    strafeDir: Math.random() < 0.5 ? -1 : 1,
                    strafeTimer: 1 + Math.random(),
                    wanderTimer: 0,
                    wanderAngle: Math.random() * Math.PI * 2
                }
            };
            resolveWalls(f);
            return f;
        }

        function spawnPoints() {
            const mx = Math.min(W * 0.13, 84);
            return {
                blue: [
                    { x: W / 2, y: H * 0.66 },
                    { x: W / 2 - mx, y: H * 0.72 },
                    { x: W / 2 + mx, y: H * 0.72 }
                ],
                red: [
                    { x: W / 2, y: H * 0.34 },
                    { x: W / 2 - mx, y: H * 0.28 },
                    { x: W / 2 + mx, y: H * 0.28 }
                ]
            };
        }

        function respawnFighter(f) {
            const pts = spawnPoints()[f.team];
            const mates = game.fighters.filter(o => o.team === f.team);
            const idx = Math.min(Math.max(0, mates.indexOf(f)), pts.length - 1);
            f.x = pts[idx].x;
            f.y = pts[idx].y;
            f.spawnX = f.x;
            f.spawnY = f.y;
            f.hp = f.maxHp;
            f.ammo = f.weapon.ammo;
            f.reloadTimer = f.weapon.reload;
            f.superCharge = 0;
            f.superReady = false;
            f.lastDamageAt = -99999;
            f.flash = 0;
            f.alive = true;
            f.aim = f.team === 'blue' ? -Math.PI / 2 : Math.PI / 2;
            resolveWalls(f);
            burst(f.x, f.y, f.color, 14);
        }

        // Бойцы не должны слипаться в одну точку
        function separateFighters() {
            for (let i = 0; i < game.fighters.length; i++) {
                const a = game.fighters[i];
                if (!a.alive) continue;
                for (let j = i + 1; j < game.fighters.length; j++) {
                    const b = game.fighters[j];
                    if (!b.alive) continue;
                    let dx = b.x - a.x;
                    let dy = b.y - a.y;
                    const d = Math.hypot(dx, dy);
                    const minD = a.r + b.r;
                    if (d > 0.001 && d < minD) {
                        const push = (minD - d) / 2;
                        dx /= d;
                        dy /= d;
                        a.x -= dx * push;
                        a.y -= dy * push;
                        b.x += dx * push;
                        b.y += dy * push;
                        resolveWalls(a);
                        resolveWalls(b);
                    } else if (d <= 0.001) {
                        b.x += 1;
                    }
                }
            }
        }

        function nearestEnemy(f, needSight) {
            let best = null;
            let bestDist = Infinity;
            for (const o of game.fighters) {
                if (!o.alive || o.team === f.team) continue;
                const d = Math.hypot(o.x - f.x, o.y - f.y);
                if (d >= bestDist) continue;
                if (needSight && !hasLineOfSight(f.x, f.y, o.x, o.y)) continue;
                bestDist = d;
                best = o;
            }
            return best;
        }

        function aimAngleForPlayer(f) {
            if (fireStick.active && Math.hypot(fireStick.x, fireStick.y) > 0.22) {
                return Math.atan2(fireStick.y, fireStick.x);
            }
            if (input.mouseActive) {
                return Math.atan2(input.mouseY - f.y, input.mouseX - f.x);
            }
            const target = nearestEnemy(f, true);
            if (target) return Math.atan2(target.y - f.y, target.x - f.x);
            return f.aim;
        }

        /* ==============================================================
           10. СТРЕЛЬБА, УРОН И СУПЕРСПОСОБНОСТИ
           ============================================================== */
        function spawnBullet(owner, angle, opts) {
            const speed = opts.speed;
            game.bullets.push({
                x: owner.x + Math.cos(angle) * (owner.r + 8),
                y: owner.y + Math.sin(angle) * (owner.r + 8),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                r: opts.r || 5,
                damage: opts.damage,
                team: owner.team,
                owner: owner,
                color: owner.color,
                life: opts.range / speed,
                pierce: !!opts.pierce,
                superShot: !!opts.superShot,
                hitIds: opts.pierce ? new Set() : null
            });
        }

        function tryShoot(f, angle, now) {
            if (!f.alive || f.ammo <= 0 || now < f.nextShotAt) return;
            const w = f.weapon;
            f.nextShotAt = now + w.cooldown;
            f.ammo -= 1;

            for (let i = 0; i < w.pellets; i++) {
                const spread = (Math.random() - 0.5) * w.spread;
                spawnBullet(f, angle + spread, {
                    damage: w.damage,
                    speed: w.bulletSpeed * (0.95 + Math.random() * 0.1),
                    range: w.range,
                    r: w.pellets > 1 ? 4 : 5
                });
            }

            burst(f.x + Math.cos(angle) * (f.r + 10), f.y + Math.sin(angle) * (f.r + 10), '#FFF3C4', 3);
        }

        function addSuperCharge(f, amount) {
            if (f.superReady) return;
            f.superCharge = Math.min(100, f.superCharge + amount);
            if (f.superCharge >= 100) {
                f.superReady = true;
                if (f.isPlayer) haptic('success');
            }
        }

        function useSuper(f) {
            if (!f || !f.superReady || !f.alive) return;
            f.superReady = false;
            f.superCharge = 0;
            const w = f.weapon;
            const angle = f.aim;

            if (f.brawler.id === 'scout') {
                // Веер из пяти пуль
                for (let i = -2; i <= 2; i++) {
                    spawnBullet(f, angle + i * 0.12, {
                        damage: w.damage * 1.15, speed: w.bulletSpeed * 1.15,
                        range: w.range * 1.1, r: 6, superShot: true
                    });
                }
            } else if (f.brawler.id === 'tank') {
                // Мощный залп в упор
                for (let i = 0; i < 9; i++) {
                    spawnBullet(f, angle + (Math.random() - 0.5) * 0.85, {
                        damage: w.damage * 1.1, speed: w.bulletSpeed * 1.1,
                        range: w.range * 1.05, r: 5, superShot: true
                    });
                }
            } else {
                // Пробивающий луч
                spawnBullet(f, angle, {
                    damage: w.damage * 2.4, speed: w.bulletSpeed * 1.3,
                    range: w.range * 1.2, r: 8, pierce: true, superShot: true
                });
            }

            burst(f.x + Math.cos(angle) * f.r, f.y + Math.sin(angle) * f.r, '#FFD54F', 16);
            if (f.isPlayer) haptic('medium');
        }

        function damageFighter(target, amount, owner, hitX, hitY) {
            if (!target.alive) return;
            target.hp -= amount;
            target.lastDamageAt = game.now;
            target.flash = 0.14;

            if (owner && owner !== target) {
                addSuperCharge(owner, amount * 0.028);
                owner.damageDealt += amount;
            }

            game.floaters.push({
                x: target.x + (Math.random() - 0.5) * 10,
                y: target.y - target.r - 20,
                text: Math.round(amount),
                life: 0.8,
                maxLife: 0.8,
                color: owner && owner.team === 'blue' ? '#B3E5FC' : '#FFCDD2'
            });

            burst(hitX || target.x, hitY || target.y, '#FFF3C4', 3);
            if (target.isPlayer) haptic('light');

            if (target.hp <= 0) {
                target.hp = 0;
                killFighter(target, owner);
            }
        }

        function killFighter(f, killer) {
            f.alive = false;
            f.deaths += 1;
            f.respawnAt = game.now + RESPAWN_TIME;
            burst(f.x, f.y, f.color, 26);

            if (killer && killer !== f) {
                killer.kills += 1;
                if (killer.team === 'blue') game.scoreBlue += 1;
                else if (killer.team === 'red') game.scoreRed += 1;
            }

            if (f.isPlayer) haptic('error');
            else if (killer && killer.isPlayer) haptic('success');

            if (game.scoreBlue >= KILLS_TO_WIN || game.scoreRed >= KILLS_TO_WIN) {
                finishMatch();
            }
        }

        function burst(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 40 + Math.random() * 170;
                game.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp,
                    life: 0.3 + Math.random() * 0.35,
                    maxLife: 0.65,
                    size: 2 + Math.random() * 3,
                    color: color
                });
            }
        }

        /* ==============================================================
           11. ИИ БОТОВ
           ============================================================== */
        function aiIntent(f, dt, now) {
            const target = nearestEnemy(f, false);

            if (!target) {
                f.ai.wanderTimer -= dt;
                if (f.ai.wanderTimer <= 0) {
                    f.ai.wanderTimer = 1.5 + Math.random() * 2;
                    f.ai.wanderAngle = Math.random() * Math.PI * 2;
                }
                return { x: Math.cos(f.ai.wanderAngle) * 0.55, y: Math.sin(f.ai.wanderAngle) * 0.55 };
            }

            const dx = target.x - f.x;
            const dy = target.y - f.y;
            const dist = Math.max(1, Math.hypot(dx, dy));
            const ideal = f.weapon.range * 0.68;
            let ix = 0;
            let iy = 0;

            if (dist > ideal * 1.1) {
                ix = dx / dist;
                iy = dy / dist;
            } else if (dist < ideal * 0.6) {
                ix = -dx / dist;
                iy = -dy / dist;
            }

            f.ai.strafeTimer -= dt;
            if (f.ai.strafeTimer <= 0) {
                f.ai.strafeDir *= -1;
                f.ai.strafeTimer = 0.8 + Math.random() * 1.6;
            }
            ix += (-dy / dist) * f.ai.strafeDir * 0.55;
            iy += (dx / dist) * f.ai.strafeDir * 0.55;

            if (pointInWall(f.x + ix * 46, f.y + iy * 46)) {
                const side = Math.random() < 0.5 ? 1 : -1;
                const px = -iy * side;
                const py = ix * side;
                ix = ix * 0.2 + px;
                iy = iy * 0.2 + py;
            }

            if (dist < f.weapon.range && hasLineOfSight(f.x, f.y, target.x, target.y)) {
                f.aim = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.12;
                tryShoot(f, f.aim, now);
                if (f.superReady && Math.random() < 0.3) useSuper(f);
            } else {
                f.aim = Math.atan2(dy, dx);
            }

            return { x: ix, y: iy };
        }

        /* ==============================================================
           12. ОБНОВЛЕНИЕ ИГРЫ
           ============================================================== */
        function updateFighter(f, dt, now) {
            if (!f.alive) {
                if (now >= f.respawnAt) respawnFighter(f);
                return;
            }

            if (f.flash > 0) f.flash = Math.max(0, f.flash - dt);

            // Регенерация здоровья вне боя
            if (now - f.lastDamageAt > REGEN_DELAY && f.hp < f.maxHp) {
                f.hp = Math.min(f.maxHp, f.hp + f.maxHp * REGEN_RATE * dt);
            }

            // Перезарядка патронов
            if (f.ammo < f.weapon.ammo) {
                f.reloadTimer -= dt;
                if (f.reloadTimer <= 0) {
                    f.ammo += 1;
                    f.reloadTimer = f.weapon.reload;
                }
            }

            // Куда боец хочет двигаться
            let ix = 0;
            let iy = 0;
            if (f.isPlayer) {
                ix = playerMoveX();
                iy = playerMoveY();
            } else {
                const intent = aiIntent(f, dt, now);
                ix = intent.x;
                iy = intent.y;
            }

            const len = Math.hypot(ix, iy);
            if (len > 1) { ix /= len; iy /= len; }
            if (len > 0.001) {
                f.x += ix * f.speed * dt;
                f.y += iy * f.speed * dt;
            }

            resolveWalls(f);
            f.x = clamp(f.x, f.r + 4, W - f.r - 4);
            f.y = clamp(f.y, f.r + 4, H - f.r - 4);

            // Прицел и огонь игрока
            if (f.isPlayer) {
                f.aim = aimAngleForPlayer(f);
                if (input.fireHeld) tryShoot(f, f.aim, now);
            }
        }

        function updateBullets(dt) {
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const b = game.bullets[i];
                b.life -= dt;
                if (b.life <= 0) {
                    game.bullets.splice(i, 1);
                    continue;
                }

                const speed = Math.hypot(b.vx, b.vy);
                const steps = Math.max(1, Math.ceil((speed * dt) / 8));
                let dead = false;

                for (let s = 0; s < steps && !dead; s++) {
                    b.x += (b.vx * dt) / steps;
                    b.y += (b.vy * dt) / steps;

                    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30 || pointInWall(b.x, b.y)) {
                        burst(b.x, b.y, b.color, 3);
                        dead = true;
                        break;
                    }

                    for (const f of game.fighters) {
                        if (!f.alive || f.team === b.team) continue;
                        if (b.hitIds && b.hitIds.has(f.id)) continue;
                        if (Math.hypot(b.x - f.x, b.y - f.y) > b.r + f.r) continue;

                        damageFighter(f, b.damage, b.owner, b.x, b.y);
                        if (b.hitIds) {
                            b.hitIds.add(f.id);
                        } else {
                            dead = true;
                        }
                        break;
                    }
                }

                if (dead || game.mode !== 'playing') game.bullets.splice(i, 1);
            }
        }

        function updateMatch(dt, now) {
            game.timeLeft -= dt;
            if (game.timeLeft <= 0) {
                game.timeLeft = 0;
                updateHud();
                finishMatch();
                return;
            }

            input.fireHeld = isFiring();

            for (const f of game.fighters) updateFighter(f, dt, now);
            separateFighters();
            updateBullets(dt);

            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.life -= dt;
                if (p.life <= 0) {
                    game.particles.splice(i, 1);
                    continue;
                }
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= 0.92;
                p.vy *= 0.92;
            }

            for (let i = game.floaters.length - 1; i >= 0; i--) {
                const fl = game.floaters[i];
                fl.life -= dt;
                if (fl.life <= 0) {
                    game.floaters.splice(i, 1);
                    continue;
                }
                fl.y -= 26 * dt;
            }

            if (game.mode === 'playing') updateHud();
        }

        /* ==============================================================
           13. ГЛАВНЫЙ ЦИКЛ
           ============================================================== */
        let lastFrame = 0;

        function frame(ts) {
            if (!lastFrame) lastFrame = ts;
            let dt = (ts - lastFrame) / 1000;
            lastFrame = ts;
            if (!Number.isFinite(dt) || dt < 0) dt = 0;
            dt = Math.min(dt, 0.05);
            game.now = ts;

            if (game.mode === 'playing') updateMatch(dt, ts);
            render();
            requestAnimationFrame(frame);
        }

        /* ==============================================================
           14. ОТРИСОВКА
           ============================================================== */
        function drawWalls() {
            for (const w of walls) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.30)';
                ctx.fillRect(w.x + 5, w.y + 7, w.w, w.h);

                ctx.fillStyle = '#8D6E63';
                ctx.fillRect(w.x, w.y, w.w, w.h);

                ctx.fillStyle = '#6D4C41';
                ctx.fillRect(w.x, w.y, w.w, 6);
                ctx.fillRect(w.x, w.y + w.h - 6, w.w, 6);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.fillRect(w.x, w.y, 6, w.h);

                ctx.strokeStyle = '#4E342E';
                ctx.lineWidth = 2;
                ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.16)';
                ctx.lineWidth = 1;
                for (let x = w.x + 18; x < w.x + w.w - 6; x += 18) {
                    ctx.beginPath();
                    ctx.moveTo(x, w.y + 6);
                    ctx.lineTo(x, w.y + w.h - 6);
                    ctx.stroke();
                }
            }
        }

        function drawFighter(f) {
            if (!f.alive) {
                const left = Math.max(0, (f.respawnAt - game.now) / 1000);
                ctx.save();
                ctx.globalAlpha = 0.6;
                ctx.strokeStyle = f.team === 'blue' ? '#29B6F6' : '#EF5350';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(f.spawnX, f.spawnY, f.r + 8, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(Math.ceil(left)), f.spawnX, f.spawnY);
                ctx.restore();
                return;
            }

            const r = f.r;

            // Тень
            ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
            ctx.beginPath();
            ctx.ellipse(f.x, f.y + r * 0.85, r * 0.95, r * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            // Кольцо команды
            ctx.lineWidth = 3;
            ctx.strokeStyle = f.team === 'blue' ? 'rgba(41, 182, 246, 0.95)' : 'rgba(239, 83, 80, 0.95)';
            ctx.beginPath();
            ctx.arc(f.x, f.y, r + 2, 0, Math.PI * 2);
            ctx.stroke();

            // Готовый супер
            if (f.superReady) {
                ctx.strokeStyle = 'rgba(255, 213, 79, 0.9)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(f.x, f.y, r + 7, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Корпус
            const grad = ctx.createLinearGradient(f.x, f.y - r, f.x, f.y + r);
            grad.addColorStop(0, f.color);
            grad.addColorStop(1, f.colorDark);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
            ctx.fill();

            // Ствол
            ctx.strokeStyle = '#1b2632';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(f.x, f.y);
            ctx.lineTo(f.x + Math.cos(f.aim) * (r + 9), f.y + Math.sin(f.aim) * (r + 9));
            ctx.stroke();
            ctx.lineCap = 'butt';

            // Вспышка от урона
            if (f.flash > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + Math.min(0.8, f.flash * 5) + ')';
                ctx.beginPath();
                ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Полоска здоровья
            const bw = 44;
            const bh = 6;
            const bx = f.x - bw / 2;
            const by = f.y - r - 20;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
            ctx.fillStyle = f.team === 'blue' ? '#29B6F6' : '#EF5350';
            ctx.fillRect(bx, by, bw * Math.max(0, f.hp / f.maxHp), bh);

            // Имя
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(f.isPlayer ? 'ТЫ' : f.brawler.name, f.x, by - 5);

            // Маркер игрока
            if (f.isPlayer) {
                ctx.fillStyle = '#FFD54F';
                ctx.beginPath();
                ctx.moveTo(f.x - 5, by - 26);
                ctx.lineTo(f.x + 5, by - 26);
                ctx.lineTo(f.x, by - 19);
                ctx.closePath();
                ctx.fill();
            }

            // Патроны игрока
            if (f.isPlayer) {
                const total = f.weapon.ammo;
                const pipW = 10;
                const gap = 4;
                const startX = f.x - (total * pipW + (total - 1) * gap) / 2;
                for (let i = 0; i < total; i++) {
                    ctx.fillStyle = i < f.ammo ? '#FFD54F' : 'rgba(255, 255, 255, 0.2)';
                    ctx.fillRect(startX + i * (pipW + gap), by + bh + 4, pipW, 4);
                }
            }

            // Подсказка прицела игрока
            if (f.isPlayer && game.mode === 'playing') {
                ctx.save();
                ctx.globalAlpha = 0.3;
                ctx.strokeStyle = '#FFD54F';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(f.x + Math.cos(f.aim) * (r + 14), f.y + Math.sin(f.aim) * (r + 14));
                ctx.lineTo(f.x + Math.cos(f.aim) * (r + 80), f.y + Math.sin(f.aim) * (r + 80));
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawBullets() {
            ctx.save();
            ctx.shadowBlur = 8;
            for (const b of game.bullets) {
                ctx.shadowColor = b.color;
                ctx.fillStyle = b.superShot ? '#FFF3C4' : b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawParticles() {
            for (const p of game.particles) {
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function drawFloaters() {
            ctx.save();
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (const f of game.floaters) {
                ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
                ctx.fillStyle = f.color;
                ctx.fillText(f.text, f.x, f.y);
            }
            ctx.restore();
        }

        function drawDeathOverlay() {
            const p = game.player;
            if (!p || p.alive || game.mode !== 'playing') return;
            const left = Math.max(0, (p.respawnAt - game.now) / 1000);

            ctx.save();
            ctx.fillStyle = 'rgba(120, 0, 0, 0.18)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fillRect(0, H / 2 - 44, W, 88);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ВОЗРОЖДЕНИЕ', W / 2, H / 2 - 12);
            ctx.fillStyle = '#FFD54F';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText(Math.ceil(left) + '…', W / 2, H / 2 + 22);
            ctx.restore();
        }

        function render() {
            ctx.fillStyle = groundPattern || '#2E6B3E';
            ctx.fillRect(0, 0, W, H);

            drawWalls();

            for (const f of game.fighters) drawFighter(f);
            drawBullets();
            drawParticles();
            drawFloaters();

            if (vignette) {
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, W, H);
            }

            drawDeathOverlay();
        }

        /* ==============================================================
           15. ИНТЕРФЕЙС: СЧЁТ, МЕНЮ, РЕЗУЛЬТАТ
           ============================================================== */
        const menuEl = document.getElementById('menu');
        const resultEl = document.getElementById('result');
        const cardsEl = document.getElementById('cards');
        const winsLabel = document.getElementById('winsLabel');
        const resultTitle = document.getElementById('resultTitle');
        const resultScore = document.getElementById('resultScore');
        const resultSub = document.getElementById('resultSub');
        const hintEl = document.getElementById('hint');
        const superBtn = document.getElementById('superBtn');
        const scoreBlueEl = document.getElementById('scoreBlue');
        const scoreRedEl = document.getElementById('scoreRed');
        const timerEl = document.getElementById('timer');

        let lastHud = { blue: -1, red: -1, time: '', superP: -1, superReady: null };

        function updateHud() {
            if (lastHud.blue !== game.scoreBlue) {
                scoreBlueEl.textContent = game.scoreBlue;
                lastHud.blue = game.scoreBlue;
            }
            if (lastHud.red !== game.scoreRed) {
                scoreRedEl.textContent = game.scoreRed;
                lastHud.red = game.scoreRed;
            }

            const sec = Math.max(0, Math.ceil(game.timeLeft));
            const label = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
            if (lastHud.time !== label) {
                timerEl.textContent = label;
                lastHud.time = label;
            }

            const p = game.player;
            if (p) {
                const charge = Math.round(p.superCharge);
                if (lastHud.superP !== charge) {
                    superBtn.style.setProperty('--p', String(charge));
                    lastHud.superP = charge;
                }
                if (lastHud.superReady !== p.superReady) {
                    superBtn.classList.toggle('ready', p.superReady);
                    lastHud.superReady = p.superReady;
                }
            }
        }

        function barWidth(value, max) {
            return Math.max(6, Math.min(100, Math.round((value / max) * 100)));
        }

        function renderCards() {
            const maxHp = Math.max.apply(null, BRAWLERS.map(b => b.hp));
            const maxDmg = Math.max.apply(null, BRAWLERS.map(b => b.weapon.damage * b.weapon.pellets));
            const maxSpeed = Math.max.apply(null, BRAWLERS.map(b => b.speed));
            cardsEl.innerHTML = '';

            BRAWLERS.forEach(b => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'card' + (b.id === selectedBrawlerId ? ' selected' : '');

                const head = document.createElement('div');
                head.className = 'avatar';
                head.textContent = b.icon;

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = b.name;

                card.appendChild(head);
                card.appendChild(name);

                const rows = [
                    { label: 'HP', value: barWidth(b.hp, maxHp) },
                    { label: 'УРОН', value: barWidth(b.weapon.damage * b.weapon.pellets, maxDmg) },
                    { label: 'СКОР', value: barWidth(b.speed, maxSpeed) }
                ];

                rows.forEach(row => {
                    const stat = document.createElement('div');
                    stat.className = 'stat';
                    const labelEl = document.createElement('span');
                    labelEl.textContent = row.label;
                    const bar = document.createElement('span');
                    bar.className = 'bar';
                    const fill = document.createElement('i');
                    fill.style.width = row.value + '%';
                    bar.appendChild(fill);
                    stat.appendChild(labelEl);
                    stat.appendChild(bar);
                    card.appendChild(stat);
                });

                card.addEventListener('click', () => {
                    selectedBrawlerId = b.id;
                    renderCards();
                    haptic('light');
                });

                cardsEl.appendChild(card);
            });
        }

        function showHint() {
            hintEl.classList.remove('show');
            void hintEl.offsetWidth;
            hintEl.classList.add('show');
        }

        function startMatch() {
            document.body.classList.remove('in-menu');
            menuEl.classList.add('hidden');
            resultEl.classList.add('hidden');
            resetInputs();
            resize();

            const chosen = BRAWLERS.find(b => b.id === selectedBrawlerId) || BRAWLERS[0];
            const pts = spawnPoints();

            game.fighters = [];
            game.bullets = [];
            game.particles = [];
            game.floaters = [];
            game.scoreBlue = 0;
            game.scoreRed = 0;
            game.timeLeft = MATCH_LENGTH;
            game.mode = 'playing';

            game.player = makeFighter('blue', chosen, pts.blue[0].x, pts.blue[0].y, true);
            game.fighters.push(game.player);

            const others = BRAWLERS.filter(b => b.id !== chosen.id);
            for (let i = 1; i < 3; i++) {
                game.fighters.push(makeFighter('blue', others[(i - 1) % others.length], pts.blue[i].x, pts.blue[i].y, false));
            }
            for (let i = 0; i < 3; i++) {
                game.fighters.push(makeFighter('red', BRAWLERS[(i + 1) % BRAWLERS.length], pts.red[i].x, pts.red[i].y, false));
            }

            lastHud = { blue: -1, red: -1, time: '', superP: -1, superReady: null };
            updateHud();
            showHint();
            haptic('light');
        }

        function finishMatch() {
            if (game.mode !== 'playing') return;
            game.mode = 'over';
            updateHud();

            const blue = game.scoreBlue;
            const red = game.scoreRed;
            const win = blue > red;
            const draw = blue === red;

            stats.matches += 1;
            if (win) stats.wins += 1;
            if (game.player) stats.bestKills = Math.max(stats.bestKills, game.player.kills);
            saveStats(stats);

            document.body.classList.add('in-menu');
            menuEl.classList.add('hidden');
            resultEl.classList.remove('hidden');

            resultTitle.textContent = draw ? 'НИЧЬЯ' : win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
            resultTitle.className = 'result-title ' + (draw ? 'draw' : win ? 'win' : 'lose');
            resultScore.textContent = blue + ' : ' + red;

            if (draw) {
                resultSub.textContent = 'Равный бой. Попробуй ещё раз!';
            } else if (win) {
                resultSub.textContent = 'Твой счёт: ' + (game.player ? game.player.kills : 0) + ' фрагов. Побед всего: ' + stats.wins;
            } else {
                resultSub.textContent = 'Твой счёт: ' + (game.player ? game.player.kills : 0) + ' фрагов. Ничего, реванш!';
            }

            haptic(win ? 'success' : 'error');
        }

        function showMenu() {
            game.mode = 'menu';
            game.fighters = [];
            game.bullets = [];
            game.particles = [];
            game.floaters = [];
            game.player = null;
            game.timeLeft = MATCH_LENGTH;
            game.scoreBlue = 0;
            game.scoreRed = 0;

            document.body.classList.add('in-menu');
            menuEl.classList.remove('hidden');
            resultEl.classList.add('hidden');
            winsLabel.textContent = 'Побед: ' + stats.wins + ' · Матчей: ' + stats.matches;

            lastHud = { blue: -1, red: -1, time: '', superP: -1, superReady: null };
            updateHud();
            superBtn.classList.remove('ready');
            superBtn.style.setProperty('--p', '0');
        }

        /* ==============================================================
           16. КНОПКИ И ЗАПУСК
           ============================================================== */
        document.getElementById('playBtn').addEventListener('click', startMatch);
        document.getElementById('againBtn').addEventListener('click', startMatch);
        document.getElementById('menuBtn').addEventListener('click', showMenu);
        superBtn.addEventListener('click', () => {
            if (game.mode === 'playing') useSuper(game.player);
        });

        resize();
        renderCards();
        showMenu();
        requestAnimationFrame(frame);

    })();
    </script>
</body>
</html>
